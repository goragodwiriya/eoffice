<div class="card-groups">
  <header>
    <div>
      <h1 class="icon-tools" data-i18n>{LNG_Repair list}</h1>
      <p data-i18n>{LNG_Repair jobs}</p>
    </div>
    <div>
      <a class="btn btn-primary icon-new" href="/repair-receive?id=0" data-i18n>{LNG_Get a repair}</a>
    </div>
  </header>
  <div class="content-body">
    <div class="tablebody">
      <table class="table border fullwidth" data-table="repairJobs" data-source="api/repair/jobs" data-default-sort="created_at desc" data-page-size="25"
             data-search-columns="name,phone,job_id,topic" data-search-placeholder="{LNG_Search}..." data-show-checkbox="true" data-actions='{"delete":"Delete"}' data-action-url="api/repair/jobs/action"
             data-row-actions='{
                "view": {
                  "title": "Repair job description",
                  "className": "btn btn-success icon-file"
                },
                "status": {
                  "title": "Update repair status",
                  "className": "btn btn-warning icon-tools"
                }
              }'>
        <thead>
          <tr>
            <th data-field="job_id" data-sort="job_id" data-formatter="formatRepairJob" data-i18n>{LNG_Job No.}</th>
            <th data-field="name" data-sort="name" data-i18n>{LNG_Informer}</th>
            <th data-field="phone" class="center" data-cell-class="center" data-template="<a href='tel:${phone}'>${phone}</a>" data-i18n>{LNG_Phone}</th>
            <th data-field="created_at" data-sort="created_at" class="center" data-cell-class="center" data-format="date" data-filter="true" data-type="daterange" data-range-names="from,to"
                data-range-presets="today,7d,30d,thismonth,lastmonth" data-i18n>{LNG_Received Date}</th>
            <th data-field="operator_id" data-filter="true" data-type="select" data-show-all="true" data-all-value="" class="center" data-cell-class="center"
                data-template="${operator_name}" data-i18n>{LNG_Operator}</th>
            <th data-field="status" data-sort="status" class="center" data-cell-class="center" data-filter="true" data-type="select" data-show-all="true" data-all-value=""
                data-template="<span class='repair-status' style='background-color:${status_color}'>${status_text}</span>" data-i18n>{LNG_Repair status}</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
